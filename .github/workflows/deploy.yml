name: Deploy Lambda to S3 and Update Function

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-west-2

    - name: Build Docker image
      run: |
        docker build -t 318874356511.dkr.ecr.eu-west-2.amazonaws.com/erewash-rag-api:latest

    - name: Push Docker image
      run: |
        docker push 318874356511.dkr.ecr.eu-west-2.amazonaws.com/erewash-rag-api:latest
        
    - name: Create deployment package
      run: |
        zip -r erewash-rag-api.zip lambda_function.py articles.json
        
    - name: Upload to S3
      run: |
        aws s3 cp erewash-rag-api.zip s3://erewash-rag-server-code/erewash-rag-api.zip
        
    - name: Update Lambda function
      run: |
        aws lambda update-function-code \
          --function-name erewash-rag-api \
          --s3-bucket erewash-rag-server-code \
          --s3-key erewash-rag-api.zip \
          --region eu-west-2
          
    - name: Wait for update to complete
      run: |
        aws lambda wait function-updated \
          --function-name erewash-rag-api \
          --region eu-west-2
          
    - name: Publish new version
      run: |
        aws lambda publish-version \
          --function-name erewash-rag-api \
          --description "Deployed from GitHub Actions" \
          --region eu-west-2 